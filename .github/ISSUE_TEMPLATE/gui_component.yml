name: GUI-Baustein
description: Wunsch oder Fehler an einem Baustein der Oberfläche (GUI-Prototypen).
title: "GUI: "
labels: ["verbesserung", "gui", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Ablauf:** Neue Meldungen erhalten das Label `triage` und werden vom Projektverantwortlichen geprüft. Erst seine
        ausdrückliche Freigabe (Label `_1 bereit`) macht daraus einen Entwicklungsauftrag.

        **Datenschutz (IDG Kanton Zürich):** Keine echten Namen, Klassen, Telefonnummern oder Bildschirmfotos mit
        Personendaten anhängen. Das Intranet ist ein Prototyp mit erfundenen Testdaten – bitte nur diese verwenden.
  - type: markdown
    attributes:
      value: |
        Wünsche zu einem Baustein lassen sich auch direkt im Intranet unter **GUI-Prototypen › Baustein › Wünsche**
        erfassen. Von dort kann die Administration den Wunsch als Issue vorbereiten.
  - type: input
    id: component
    attributes:
      label: Baustein
      description: Titel aus dem Inhaltsverzeichnis der GUI-Prototypen, z. B. Tabellen, Dropdown, Button
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Freigegebene Version des Bausteins
      placeholder: z. B. v1.2.0
  - type: textarea
    id: wish
    attributes:
      label: Wunsch
      description: Was soll sich am Baustein ändern und warum?
    validations:
      required: true
  - type: textarea
    id: pages
    attributes:
      label: Betroffene Seiten
      description: Wo fällt es auf? (Adresse oder Menüpunkt)
