name: Fehler melden
description: Etwas im Intranet funktioniert nicht wie erwartet.
title: "Fehler: "
labels: ["fehler", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        **Ablauf:** Neue Meldungen erhalten das Label `triage` und werden vom Projektverantwortlichen geprüft. Erst seine
        ausdrückliche Freigabe (Label `_1 bereit`) macht daraus einen Entwicklungsauftrag.

        **Datenschutz (IDG Kanton Zürich):** Keine echten Namen, Klassen, Telefonnummern oder Bildschirmfotos mit
        Personendaten anhängen. Das Intranet ist ein Prototyp mit erfundenen Testdaten – bitte nur diese verwenden.
  - type: markdown
    attributes:
      value: |
        **Sicherheitslücken bitte nicht hier**, sondern privat melden (siehe SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Steht unter «Versionen» (Menü unten), z. B. 0.32.0 oder «0.31.0 · Developer Release (+3)»
      placeholder: "0.31.0"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Start / Mitteilungen / Termine
        - Pinnwand / Umfragen
        - Fachanwendungen (CMI, Escola, ASM, Jamf, LMVZ)
        - Wissen & Ablage
        - Personen & Organisation
        - Unterricht
        - Räume & Geräte
        - Verwaltung / Bestellungen
        - Fachstelle ICT
        - Plugins
        - GUI-Prototypen / Farbkonzept
        - Benachrichtigungen
        - Anmeldung / Rechte / Rollen
        - Einstellungen / Administration
        - Browser-Erweiterung
        - Deployment / Betrieb
        - anderes
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Angemeldet mit Rolle
      options:
        - Administration
        - Schulleitung
        - Schulverwaltung
        - Fachstelle ICT
        - Redaktion
        - Lehrperson
        - Mitarbeitende
        - nicht angemeldet
  - type: dropdown
    id: device
    attributes:
      label: Gerät / Browser
      options:
        - Computer – Chrome / Edge
        - Computer – Safari
        - Computer – Firefox
        - iPad
        - Smartphone
        - anderes
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, was ist stattdessen passiert? Fehlermeldung wörtlich einfügen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen
      placeholder: |
        1. Seite … öffnen (Adresse, z. B. /personen)
        2. Auf … klicken
        3. → Fehler …
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Weitere Hinweise
      description: Bildschirmfoto (nur Testdaten), Uhrzeit, Häufigkeit
