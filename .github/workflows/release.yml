name: release

# Release anlegen (Ablauf aus TagStudio, docs/KONZEPT-VERSIONIERUNG.md):
# - Der Projektverantwortliche gibt ein Release frei → `php tools/release.php 0.32.0 --commit` + Push.
# - Nach grünem Deployment (Workflow «deploy») prüft dieser Workflow, ob es den Tag v<VERSION> schon gibt.
#   Wenn nicht, legt er Tag v<VERSION> auf den ausgerollten Commit und das GitHub-Release «Intranet <VERSION>»
#   mit dem Text aus dem CHANGELOG an. Vorabversionen (0.32.0-beta.1) werden als Pre-Release markiert.
# - Alle anderen Deployments sind «Developer Release» (Commits nach dem Tag) – hier passiert dann nichts.
# - Von Hand (Run workflow): dieselbe Prüfung für main, oder mit «nachtragen» einmalig die Tags und Releases
#   aus .github/release-backfill.txt (v0.11.0–v0.31.0). Solange es noch keinen Versions-Tag gibt, legt der
#   automatische Lauf nichts an (sonst bekäme v0.31.0 einen falschen Commit).
on:
  workflow_run:
    workflows: [deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      nachtragen:
        description: 'Fehlende Releases aus .github/release-backfill.txt nachtragen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Fehlende Releases nachtragen
        if: ${{ inputs.nachtragen }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -v '^#' .github/release-backfill.txt | while read -r ver sha; do
            [ -n "$ver" ] || continue
            if gh api "repos/$GH_REPO/git/ref/tags/v$ver" --silent 2>/dev/null; then
              echo "v$ver gibt es schon"; continue
            fi
            date="$(grep -m1 "^## \[$ver\]" CHANGELOG.md | sed 's/.*– //')"
            php tools/release.php --notes "$ver" > notes.md
            printf '\n\n---\n_Rückwirkend angelegt (Stand vom %s). Bis 0.31.0 wurde die Version bei jeder Änderung erhöht._\n' "$date" >> notes.md
            latest=false
            [ "$ver" = "$(grep -v '^#' .github/release-backfill.txt | tail -n1 | cut -d' ' -f1)" ] && latest=true
            gh release create "v$ver" --target "$sha" --title "Intranet $ver" --notes-file notes.md --latest="$latest"
            echo "v$ver → ${sha::7}"
          done

      - name: Tag und Release anlegen
        if: ${{ !inputs.nachtragen }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          ver="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$ver" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Ungültige Version::VERSION enthält «$ver»"; exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v$ver" --silent 2>/dev/null; then
            echo "Tag v$ver gibt es schon – Developer Release, kein neues Release."
            exit 0
          fi
          if [ -z "$(git tag -l 'v[0-9]*')" ]; then
            echo "::notice title=Noch keine Versions-Tags::Zuerst von Hand «release» mit «nachtragen» starten."
            exit 0
          fi
          php tools/release.php --check
          php tools/release.php --notes "$ver" > notes.md
          pre=()
          [[ "$ver" == *-* ]] && pre=(--prerelease)
          gh release create "v$ver" --target "$SHA" --title "Intranet $ver" --notes-file notes.md "${pre[@]}"
          echo "::notice title=Release angelegt::Tag v$ver und Release «Intranet $ver» auf ${SHA::7}"
