name: deploy

# Standardweg: jede Änderung auf main wird geprüft und danach automatisch veröffentlicht.
# Reine Doku-Änderungen lösen kein Deployment aus.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Zwischenspeicher Composer und npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/composer
            ~/.npm
          key: deps-${{ runner.os }}-${{ hashFiles('composer.json', 'composer.lock', 'package.json', 'package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: |
          set -o pipefail
          composer ci:check 2>&1 | tee ci-output.txt

      - name: Fehler anzeigen
        if: failure()
        run: |
          .github/scripts/report-failure.sh ci-output.txt 'CI-Prüfung fehlgeschlagen'
          # Formatierung: Korrektur als Diff anzeigen, damit sie ohne lokale Werkzeuge übernommen werden kann
          if grep -q 'Formatting issues' ci-output.txt; then
            npx vp check --fix > /dev/null 2>&1 || true
            git diff > fmt.diff
            .github/scripts/report-failure.sh fmt.diff 'Formatierung (Korrektur)' 400
          fi

  deploy:
    needs: ci
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
