name: deploy

# Standardweg: jede Änderung auf main wird geprüft und danach automatisch veröffentlicht.
# Reine Doku-Änderungen lösen kein Deployment aus.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      fmt: ${{ steps.report.outputs.fmt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Tags für die Prüfung der Plugin-Versionen (tools/release.php --check)

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Zwischenspeicher Composer und npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/composer
            ~/.npm
          key: deps-${{ runner.os }}-${{ hashFiles('composer.json', 'composer.lock', 'package.json', 'package-lock.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: |
          set -o pipefail
          composer ci:check 2>&1 | tee ci-output.txt

      - name: Fehler anzeigen
        id: report
        if: failure()
        run: |
          .github/scripts/report-failure.sh ci-output.txt 'CI-Prüfung fehlgeschlagen'
          # Formatierung: Korrektur erzeugen; der Job format-fix legt sie als Branch ci/format-fix ab
          if grep -q 'Formatting issues' ci-output.txt; then
            npx vp check --fix > /dev/null 2>&1 || true
            git diff > fmt.diff
            .github/scripts/report-failure.sh fmt.diff 'Formatierung (Korrektur)'
            echo "fmt=$(gzip -9c fmt.diff | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi

  # Nur bei Formatfehlern: übernimmt die Korrektur aus dem Job ci (git apply, kein npm) in den Branch
  # ci/format-fix. So lässt sie sich ohne lokale Werkzeuge holen: git fetch origin ci/format-fix.
  format-fix:
    needs: ci
    if: failure() && needs.ci.outputs.fmt != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Korrektur als Branch ablegen
        env:
          FMT: ${{ needs.ci.outputs.fmt }}
        run: |
          printf '%s' "$FMT" | base64 -d | gunzip > "$RUNNER_TEMP/fmt.diff"
          git apply "$RUNNER_TEMP/fmt.diff"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c ci/format-fix
          git commit -qam "Formatierung (vp check --fix) für ${GITHUB_SHA::7}"
          git push -f origin ci/format-fix
          echo "::notice title=Formatierung::Korrektur im Branch ci/format-fix (git fetch origin ci/format-fix)"

  deploy:
    needs: ci
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit

  # Infomaniak-Dev (#171): wird übersprungen, solange das Environment «dev» nicht eingerichtet ist
  deploy-dev:
    needs: ci
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: dev
      target: /docker/intranet-dev
      instanz: intranet-dev
