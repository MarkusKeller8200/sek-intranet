name: deploy-live

# Produktion auf dem Infomaniak-Server (#173): intranet.sekbuelach.ch, Instanz «intranet-live» – auf demselben
# Server wie intranet-dev.sekbuelach.ch, mit eigenen Daten.
# Nur auf ausdrückliche Anweisung von Markus: kein automatischer Start (weder bei Push noch bei einem Release).
# Start: Actions → deploy-live → Run workflow mit einer Version (Tag, z. B. v0.38.0) und «ja». Auch zum Zurückgehen
# auf eine frühere Version. Ist das Environment «live» nicht eingerichtet (VPS_HOST fehlt), wird nichts deployt.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (Tag), z. B. v0.38.0'
        required: true
      confirm:
        description: 'Produktion jetzt aktualisieren? «ja» eintippen'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Release bestimmen
        id: tag
        env:
          EINGABE: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "ja" || { echo "::error::Abgebrochen – bitte «ja» eintippen."; exit 1; }
          [[ "$EINGABE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version im Format v1.2.3 angeben."; exit 1; }
          git rev-parse -q --verify "refs/tags/$EINGABE" > /dev/null || { echo "::error::Tag $EINGABE gibt es nicht."; exit 1; }
          echo "::notice title=Produktion::$EINGABE wird nach intranet.sekbuelach.ch deployt."
          echo "tag=$EINGABE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/_deploy.yml
    secrets: inherit
    with:
      environment: live
      target: /docker/intranet-live
      instanz: intranet-live
      ref: ${{ needs.version.outputs.tag }}
