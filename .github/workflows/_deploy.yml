name: deploy-steps

# Gemeinsame Deployment-Schritte, aufgerufen von deploy.yml und deploy-quick.yml.
# Pro Ziel ein GitHub-Environment mit VPS_HOST, INTRANET_HOST, optional VPS_USER (Variablen) sowie VPS_SSH_KEY und
# VPS_KNOWN_HOSTS (Secrets):
#   production – Hostinger, Instanz «intranet» (hostinger.sekbuelach.ch)
#   dev        – Infomaniak, Instanz «intranet-dev» (intranet-dev.sekbuelach.ch, #171)
#   live       – Infomaniak, Instanz «intranet-live» (intranet.sekbuelach.ch, #173; nur Releases, mit Freigabe)
# Ist ein Environment ausser production nicht eingerichtet (VPS_HOST fehlt), wird der Deploy übersprungen.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: production
      target:
        type: string
        default: /docker/intranet
      instanz:
        type: string
        default: intranet
      ref:
        description: 'Commit oder Tag (leer: Commit des Laufs)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    environment: ${{ inputs.environment }}
    env:
      HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST || (inputs.environment == 'production' && '76.13.156.138' || '') }}
      INTRANET_HOST: ${{ vars.INTRANET_HOST || (inputs.environment == 'production' && 'hostinger.sekbuelach.ch' || '') }}
      VPS_USER: ${{ vars.VPS_USER || 'root' }}
      TARGET: ${{ inputs.target }}
      INSTANZ: ${{ inputs.instanz }}
    steps:
      - name: Ziel prüfen
        id: ziel
        run: |
          if [ -z "$HOST" ] || [ -z "$INTRANET_HOST" ]; then
            echo "::notice title=Deploy übersprungen::Environment «${{ inputs.environment }}» ist nicht eingerichtet (VPS_HOST/INTRANET_HOST fehlen)."
            echo "ok=" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.ziel.outputs.ok
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Tags für «Developer Release» (git describe)
          ref: ${{ inputs.ref || github.sha }}

      - name: SSH vorbereiten
        if: steps.ziel.outputs.ok
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY" || { echo "Secret VPS_SSH_KEY fehlt"; exit 1; }
          test -n "$KNOWN_HOSTS" || [ "${{ inputs.environment }}" = production ] || { echo "Secret VPS_KNOWN_HOSTS fehlt"; exit 1; }
          install -m 700 -d ~/.ssh
          # Windows-Zeilenenden entfernen (Kopieren aus PowerShell oder 1Password)
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" | tr -d '\r' | sed '/^[[:space:]]*$/d' > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n' "$HOST" "$VPS_USER" > ~/.ssh/config
          # Prüfen, ob VPS_KNOWN_HOSTS zum Server passt – nur Vergleich, die Verbindung prüft weiterhin streng
          if [ -z "$KNOWN_HOSTS" ]; then
            echo "Kein VPS_KNOWN_HOSTS gesetzt."
          elif ! ssh-keygen -F "$HOST" -f ~/.ssh/known_hosts > /dev/null; then
            echo "::error title=VPS_KNOWN_HOSTS passt nicht::Kein Eintrag für $HOST. Erwartet wird eine Zeile «$HOST ssh-ed25519 AAAA…»."
            exit 1
          else
            erwartet="$(ssh-keygen -lf ~/.ssh/known_hosts 2>/dev/null | awk '{print $2, $NF}' | tr '\n' ' ')"
          gemeldet="$(ssh-keyscan -T 10 -t ed25519 "$HOST" 2>/dev/null | ssh-keygen -lf - 2>/dev/null | awk '{print $2, $NF}')"
          echo "Fingerabdruck im Secret: $erwartet"
          echo "Fingerabdruck vom Server: $gemeldet"
          if [ -n "$gemeldet" ] && ! printf '%s' "$erwartet" | grep -qF "${gemeldet%% *}"; then
            # Auf Hostinger (production) nur Hinweis: dort kann das Secret einen anderen Schlüsseltyp enthalten
            if [ "${{ inputs.environment }}" = production ]; then
              echo "::warning title=VPS_KNOWN_HOSTS prüfen::Secret: $erwartet – Server meldet (ED25519): $gemeldet"
            else
              echo "::error title=VPS_KNOWN_HOSTS passt nicht::Secret: $erwartet – Server meldet: $gemeldet. Secret neu setzen (siehe docs/SERVER-INFOMANIAK.md)."
              exit 1
            fi
          fi
          fi

      - name: Quellcode übertragen
        if: steps.ziel.outputs.ok
        run: |
          ssh vps "mkdir -p $TARGET && rm -rf $TARGET/src.new && mkdir $TARGET/src.new"
          git archive --format=tar HEAD | ssh vps "tar -x -C $TARGET/src.new"
          ssh vps "cd $TARGET && rm -rf src.old && { [ -d src ] && mv src src.old || true; } && mv src.new src && cp src/docker/compose.prod.yaml docker-compose.yml"

      - name: Bauen und starten
        if: steps.ziel.outputs.ok
        run: |
          # Instanz und Hostname bei jedem Deploy nachführen (Änderungen der Variablen kommen so auf dem Server an)
          ssh vps "cd $TARGET && touch .env && chmod 600 .env && sed -i '/^INTRANET_HOST=/d;/^INTRANET_INSTANZ=/d' .env && echo 'INTRANET_HOST=$INTRANET_HOST' >> .env && echo 'INTRANET_INSTANZ=$INSTANZ' >> .env"
          passwort="$(ssh vps "cd $TARGET && grep -q '^INTRANET_ACCESS_PASSWORD=.' .env && echo 1 || true")"
          echt="$(ssh vps "cd $TARGET && grep -q '^INTRANET_SERVER_IN_SWITZERLAND=true' .env && echo 1 || true")"
          demo_aus="$(ssh vps "cd $TARGET && grep -q '^INTRANET_DEMO_LOGIN=false' .env && echo 1 || true")"
          case "${{ inputs.environment }}" in
            dev)
              [ -n "$passwort" ] || echo "::warning title=Kein Zugangspasswort::$INTRANET_HOST ist ohne INTRANET_ACCESS_PASSWORD öffentlich mit Demo-Login erreichbar."
              [ -z "$echt" ] || { echo "::error title=Echte Daten auf dev::INTRANET_SERVER_IN_SWITZERLAND gehört nur auf Live."; exit 1; }
              ;;
            live)
              if [ -n "$echt" ]; then
                # Echte Daten: nie mit Demo-Login (jede Person könnte sich als Administration anmelden)
                [ -n "$demo_aus" ] || { echo "::error title=Demo-Login auf Live::Mit INTRANET_SERVER_IN_SWITZERLAND=true muss INTRANET_DEMO_LOGIN=false in .env stehen."; exit 1; }
              else
                [ -n "$passwort" ] || echo "::warning title=Kein Zugangspasswort::$INTRANET_HOST ist ohne INTRANET_ACCESS_PASSWORD öffentlich mit Demo-Login erreichbar."
              fi
              # Sicherung vor dem Deploy (#172), sobald es Daten gibt
              if ssh vps "docker volume inspect ${INSTANZ}_intranet-storage" > /dev/null 2>&1; then
                if ssh vps "sudo -n -l /usr/local/sbin/backup.sh sichern" > /dev/null 2>&1; then
                  ssh vps "sudo -n /usr/local/sbin/backup.sh sichern" \
                    || { echo "::error title=Sicherung fehlgeschlagen::Deploy abgebrochen, Live bleibt auf dem bisherigen Stand."; exit 1; }
                elif [ -n "$echt" ]; then
                  echo "::error title=Keine Sicherung::Mit echten Daten nur nach einer Sicherung deployen (sudo backup.sh install)."; exit 1
                else
                  echo "::warning title=Keine Sicherung vor dem Deploy::backup.sh ist auf dem Server nicht eingerichtet."
                fi
              fi
              ;;
          esac
          # Build-Angaben für die Versionsanzeige (Commit und Zeitpunkt)
          # Developer Release: Commits nach dem Tag v<VERSION> (leer, wenn es noch keinen Tag gibt)
          describe="$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null || true)"
          ssh vps "cd $TARGET && sed -i '/^INTRANET_BUILD/d' .env && echo 'INTRANET_BUILD=${GITHUB_SHA::7}' >> .env && echo 'INTRANET_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)' >> .env && echo 'INTRANET_BUILD_DESCRIBE=$describe' >> .env"
          ssh vps "cd $TARGET && docker compose -p $INSTANZ up -d --build --remove-orphans && docker image prune -f"

      # Massgebend ist die Prüfung auf dem Server selbst (Traefik, Zertifikat, App).
      # Der Aufruf von GitHub aus kann an Netz-/Firewall-Regeln scheitern und gibt nur eine Warnung.
      - name: Erreichbarkeit prüfen
        if: steps.ziel.outputs.ok
        run: |
          ok=
          for i in $(seq 1 36); do
            if ssh vps "curl -fsS -o /dev/null --max-time 10 --resolve $INTRANET_HOST:443:127.0.0.1 https://$INTRANET_HOST/up" 2> check-error.txt; then
              ok=1; break
            fi
            sleep 5
          done
          if [ -z "$ok" ]; then
            ssh vps "cd $TARGET && docker compose -p $INSTANZ ps && docker compose -p $INSTANZ logs --tail=60 app" > app-logs.txt 2>&1 || true
            cat check-error.txt app-logs.txt
            cat check-error.txt app-logs.txt > failure.txt
            .github/scripts/report-failure.sh failure.txt "Intranet startet nicht (${{ inputs.environment }})"
            exit 1
          fi
          echo "Online auf dem Server: https://$INTRANET_HOST"
          if curl -4 -fsS -o /dev/null --max-time 15 "https://$INTRANET_HOST/up" 2> outside-error.txt; then
            echo "Auch von aussen erreichbar."
          else
            echo "::warning title=Von GitHub aus nicht erreichbar::$(tr '\n' ' ' < outside-error.txt)"
          fi

      - name: Sicherung prüfen
        if: steps.ziel.outputs.ok
        run: |
          # Status schreibt docker/server/backup.sh (#172); fehlt er, ist auf diesem Server keine Sicherung eingerichtet
          status="$(ssh vps "cat /var/lib/sekbuelach/backup-status 2>/dev/null" || true)"
          if [ -z "$status" ]; then
            echo "::notice title=Sicherung::Auf diesem Server ist keine Sicherung mit backup.sh eingerichtet."
            exit 0
          fi
          echo "$status"
          zeit="$(printf '%s\n' "$status" | sed -n 's/^zeit=//p')"
          ergebnis="$(printf '%s\n' "$status" | sed -n 's/^ergebnis=//p')"
          alter=$(( ( $(date +%s) - $(date -d "$zeit" +%s 2>/dev/null || echo 0) ) / 3600 ))
          if [ "$ergebnis" != ok ] || [ "$alter" -gt 36 ]; then
            echo "::warning title=Sicherung prüfen::Letzte Sicherung: $ergebnis, vor $alter Stunden."
          fi
