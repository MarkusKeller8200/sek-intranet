<!doctype html>
<html lang="de-CH">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Offline – Intranet</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                background: #f5f7f9;
                color: #191718;
            }
            main {
                max-width: 24rem;
                padding: 2rem;
                text-align: center;
            }
            img {
                width: 72px;
                height: 72px;
                border-radius: 16px;
            }
            h1 {
                font-size: 1.25rem;
                margin: 1rem 0 0.5rem;
            }
            p {
                color: #5a6570;
                line-height: 1.5;
            }
            button {
                margin-top: 1rem;
                background: #0272ad;
                color: #fff;
                border: 0;
                border-radius: 0.5rem;
                padding: 0.6rem 1.2rem;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #121314;
                    color: #eee;
                }
                p {
                    color: #a5adb5;
                }
                button {
                    background: #38b6f0;
                    color: #000;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="" />
            <h1>Keine Verbindung</h1>
            <p>
                Das Intranet ist gerade nicht erreichbar. Inhalte werden aus
                Datenschutzgründen nicht auf dem Gerät gespeichert.
            </p>
            <button onclick="location.reload()">Erneut versuchen</button>
        </main>
    </body>
</html>
